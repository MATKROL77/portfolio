# Publica el sitio en Cloudflare en cada push a `main`.
#
# Queda dormido hasta que exista el secreto CLOUDFLARE_API_TOKEN en el
# repositorio: sin el, el paso avisa y termina bien, en vez de fallar y
# mandarte un mail de error en cada push.
#
# Para encenderlo, una sola vez:
#   1. Cloudflare -> My Profile -> API Tokens -> Create Token, con permiso de
#      editar Workers. Copiar el token y el Account ID.
#   2. GitHub -> Settings -> Secrets and variables -> Actions -> New secret:
#      CLOUDFLARE_API_TOKEN  y  CLOUDFLARE_ACCOUNT_ID
#
# El PDF del CV viaja commiteado, asi que aca no hace falta regenerarlo: eso
# sigue siendo `npm run cv:pdf` en Windows cuando se toca el CV.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Verificar antes de publicar
        run: |
          npm run typecheck
          npm run lint
          npm run build

      - name: Publicar en Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Falta el secreto CLOUDFLARE_API_TOKEN."
            echo "El sitio NO se publico. Ver las instrucciones en este archivo."
            exit 0
          fi
          npx --yes wrangler@4 deploy
